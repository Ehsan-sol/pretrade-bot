name: health
true:
  schedule:
  - cron: 7,37 * * * *
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BANKR_LLM_KEY: ${{ secrets.BANKR_LLM_KEY || secrets.BANKR_API_KEY }}
      MIN_CREDIT_USD: '2'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 200
    - name: Check
      run: "problems=()\nhost=$(tr -d '[:space:]' < deploy/host 2>/dev/null); host=${host:-actions}\n\
        # 1. alive: a fresh memory save (the bot saves at least every 30 minutes)\
        \ and, on Actions, a running live-bot\nage=$(( ( $(date +%s) - $(git log -1\
        \ --format=%ct -- bot/.state.json) ) / 60 ))\nlimit=$([ \"$host\" = server\
        \ ] && echo 100 || echo 50)\n[ \"$age\" -gt \"$limit\" ] && problems+=(\"\
        the bot's memory was last saved ${age} minutes ago (limit ${limit}): it may\
        \ be down\")\nif [ \"$host\" = actions ] && [ \"$(gh run list --workflow live.yml\
        \ --status in_progress --json databaseId --jq length)\" = 0 ]; then\n  problems+=(\"\
        no live-bot run is in progress on GitHub Actions (the hourly watchdog should\
        \ restart it; if this repeats, run live-bot by hand)\")\nfi\n# 2. the loop:\
        \ errors and an unreachable board in the latest log\nerrs=$(grep -c \"loop\
        \ error\" bot/last-run.log || true); down=$(grep -c \"board unreachable\"\
        \ bot/last-run.log || true)\n[ \"${errs:-0}\" -ge 10 ] && problems+=(\"${errs}\
        \ loop errors in the latest log: $(grep \"loop error\" bot/last-run.log |\
        \ tail -1 | cut -c1-200)\")\n[ \"${down:-0}\" -ge 10 ] && problems+=(\"musebook\
        \ was unreachable ${down} times in the latest log\")\n# 3. the model account:\
        \ out of credit means no conversation replies\nif [ -n \"$BANKR_LLM_KEY\"\
        \ ]; then\n  bal=$(curl -s -m 15 -H \"Authorization: Bearer $BANKR_LLM_KEY\"\
        \ https://llm.bankr.bot/v1/credits | jq -r '.effectiveBalanceUsd // .balanceUsd\
        \ // empty')\n  [ -n \"$bal\" ] && awk \"BEGIN{exit !($bal < $MIN_CREDIT_USD)}\"\
        \ && problems+=(\"Bankr LLM credit is below \\$${MIN_CREDIT_USD}: top up at\
        \ bankr.bot/llm or conversation replies will stop\")\nfi\ngh label create\
        \ health --color B60205 --description \"the bot needs attention\" --force\
        \ >/dev/null\ngh label create correction --color FBCA04 --description \"someone\
        \ says the bot got something wrong\" --force >/dev/null\nopen=$(gh issue list\
        \ --label health --state open --json number --jq '.[0].number // empty')\n\
        if [ ${#problems[@]} -gt 0 ]; then\n  body=$(printf -- '- %s\\n' \"${problems[@]}\"\
        ); body=\"$body\"$'\\n\\n'\"Checked $(date -u '+%Y-%m-%d %H:%M UTC'), live\
        \ bot on: **${host}**. This issue closes itself when the next check is clean.\"\
        \n  if [ -z \"$open\" ]; then gh issue create --label health --title \"\U0001F6A8\
        \ the bot needs attention\" --body \"$body\"; else gh issue comment \"$open\"\
        \ --body \"still failing:\"$'\\n'\"$body\"; fi\n  printf '%s\\n' \"${problems[@]}\"\
        \nelse\n  echo \"healthy (memory saved ${age} min ago, live bot on ${host})\"\
        \n  [ -n \"$open\" ] && gh issue close \"$open\" --comment \"\u2705 recovered:\
        \ the last check was clean ($(date -u '+%H:%M UTC')).\"\nfi\n# 4. corrections:\
        \ one issue per reply that reads like someone correcting the bot\ntest -f\
        \ bot/corrections.log || exit 0\nwhile IFS= read -r line; do\n  id=$(jq -r\
        \ .postId <<<\"$line\"); [ -n \"$id\" ] || continue\n  gh issue list --label\
        \ correction --state all --search \"corr:$id in:body\" --json number --jq\
        \ length | grep -qx 0 || continue\n  who=$(jq -r .who <<<\"$line\"); ch=$(jq\
        \ -r .channel <<<\"$line\"); parent=$(jq -r .parent <<<\"$line\"); text=$(jq\
        \ -r .text <<<\"$line\")\n  gh issue create --label correction --title \"\u270B\
        \ ${who} may be correcting the bot (#${ch})\" --body \"$(printf '**%s** replied\
        \ to my post https://musebook.me/p/%s :\\n\\n> %s\\n\\nTheir post: https://musebook.me/p/%s\\\
        n\\nRead both. If the bot was wrong, fix it (and decide whether it should\
        \ say so publicly). If not, close this.\\n\\n<!-- corr:%s -->' \"$who\" \"\
        $parent\" \"$(sed 's/^/> /;1s/^> //' <<<\"$text\")\" \"$id\" \"$id\")\"\n\
        done < <(tail -n 30 bot/corrections.log)\n"
'on':
  workflow_dispatch: {}
